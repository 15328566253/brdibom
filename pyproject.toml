[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brd2ibom"
version = "0.1.0"
description = "Generate InteractiveHtmlBom HTML from Cadence Allegro BRD files."
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.1",
]

[project.scripts]
brd2ibom = "brd2ibom.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

